# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options


[profile.default]
auto_detect_solc = false
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.23"
fs_permissions = [{ access = "read", path = "./out"},{ access = "read", path = "./broadcast"}, { access = "read-write", path = "./deployments"}]
sparse_mode = true
evm_version = "london"
optimizer = true
skip = [
    "src/experiments/manager/LimitOrderDelegationManager.sol",
    "src/experiments/oneshot/**",
    "src/experiments/partial-fill/**",
    "src/experiments/X1/**",
    "src/experiments/X2/TransientStorageLib.sol",
    "src/experiments/X2/TransientERC20HookCoordinator.sol",
    "src/experiments/X3/**",
    "test/experiments/oneshot/**",
    "test/experiments/partial-fill/**",
    "test/experiments/gas/OneShotGasBenchmark.t.sol",
    "test/experiments/gas/X1CompactOrderBenchmark.t.sol",
    "test/experiments/gas/X2TransientHookBenchmark.t.sol",
    "test/experiments/gas/X2PersistentHookBenchmark.t.sol",
    "test/experiments/gas/X3ActivationCacheBenchmark.t.sol"
]

[profile.cancun]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
skip = [
    "src/experiments/manager/LimitOrderDelegationManager.sol",
    "src/experiments/oneshot/**",
    "src/experiments/partial-fill/**",
    "src/experiments/enforcers/**"
]

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 132
  multiline_func_header = "all"
  number_underscore = "preserve"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true
  
[rpc_endpoints]
  mainnet = "${MAINNET_RPC_URL}"
  linea = "${LINEA_RPC_URL}"
  sepolia = "${SEPOLIA_RPC_URL}"
  aztec = "${AZTEC_RPC_URL}"
