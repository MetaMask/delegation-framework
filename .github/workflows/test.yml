name: Tests

on: [push, pull_request]

jobs:
  pre_job:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: "read"
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: MetaMask/skip-duplicate-actions@12aca0a884f6137d619d6a8a09fcc3406ced5281 # v5.3.0
        with:
          concurrent_skipping: same_content_newer

  check-ffi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Search for 'ffi' in foundry.toml
        run: |
          if grep -q "ffi" "foundry.toml"; then
            echo "Remove ffi configuration from the foundry.toml"
            exit 1
          fi

  tests:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Install Foundry
        uses: MetaMask/foundry-toolchain@cb603ca0abb544f301eaed59ac0baf579aa6aecf # v1.0.10
        with:
          version: stable

      - name: Run Forge Install
        run: forge install

      - name: Check contract sizes
        run: forge build --sizes --skip test --skip script --optimize true

      - name: Run tests
        run: forge test -vvv
        env:
          LINEA_RPC_URL: ${{ secrets.LINEA_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          RPC_API_KEY: ${{ secrets.RPC_API_KEY }}
